name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
        env:
          APP_ENV: test
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  migration:
    name: PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kids_chores
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kids_chores
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kids_chores -d kids_chores"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://kids_chores:ci-only-password@localhost:5432/kids_chores
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install .
      - run: python -m alembic upgrade head
      - run: python -m alembic current

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      PARENT_PIN: "1357"
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      ALLOWED_ORIGIN: https://chores.example.com
      CLOUDFLARE_TUNNEL_TOKEN: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f compose.production.yaml config --quiet